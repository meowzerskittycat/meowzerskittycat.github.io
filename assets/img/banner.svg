<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100" shape-rendering="crispEdges">
  <rect width="300" height="100" fill="#ffffff"/>
  <!-- paint-bucket sky and a lumpy floor -->
  <rect width="300" height="62" fill="#c9e7ff"/>
  <path d="M0 62 Q40 56 80 63 T160 61 T240 64 T300 60 V100 H0 Z" fill="#b7d98b" stroke="#000" stroke-width="1.5"/>
  <!-- doodles -->
  <text x="18" y="34" font-family="Comic Sans MS, Comic Neue, cursive" font-size="22" fill="#000">♪</text>
  <text x="258" y="30" font-family="Times New Roman, serif" font-style="italic" font-size="26" fill="#000">∫dx</text>
  <!-- title, outlined like default ms paint text -->
  <text x="150" y="56" text-anchor="middle" font-family="Comic Sans MS, Comic Neue, cursive" font-weight="bold" font-size="36"
        fill="#ffe14d" stroke="#000" stroke-width="2" paint-order="stroke">meowzers</text>
  <!-- tiny guy -->
  <g transform="translate(40 58)">
    <ellipse cx="12" cy="16" rx="11" ry="14" fill="#ffe3c4" stroke="#000" stroke-width="1.5"/>
    <circle cx="7" cy="12" r="4" fill="#e8f4ff" stroke="#000" stroke-width="1.5"/>
    <circle cx="17" cy="12" r="4" fill="#e8f4ff" stroke="#000" stroke-width="1.5"/>
    <ellipse cx="12" cy="23" rx="5" ry="4" fill="#4a1c1c" stroke="#000"/>
  </g>
  <rect x=".75" y=".75" width="298.5" height="98.5" fill="none" stroke="#000" stroke-width="1.5"/>
</svg>
