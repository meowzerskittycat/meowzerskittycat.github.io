<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}/{{ site.board }}/ - {{ page.title }}{% else %}/{{ site.board }}/ - {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body id="top">
  <a class="skip-link" href="#main">skip to content</a>

  {% include header.html %}

  <main id="main" class="thread">
    {{ content }}
  </main>

  <hr>
  <p class="bottom-links"><a href="#top">[top]</a></p>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
