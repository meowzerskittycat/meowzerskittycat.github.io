---
layout: default
---
<article class="post">
<header class="post-header">
<h1>{{ page.title }}</h1>
<p class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
</header>
{{ content }}
</article>
<nav class="post-nav" aria-label="Blog">
<a href="{{ '/blog/' | relative_url }}">All posts</a>
</nav>
