{% include nav-items.html %}
<div id="header">
<a href="{{ '/' | relative_url }}" id="headerLink">{{ site.title }}</a>
<span id="headerSubtitle">{{ site.tagline }}</span>
</div>
<div id="menu">
<span class="left">
{% for item in nav %}{% assign parts = item | split: "|" %}<a href="{{ parts[0] | relative_url }}"{% if page.url == parts[0] %} class="thisSite" aria-current="page"{% endif %}>{{ parts[1] }}</a>
{% endfor %}</span>
<span class="right">
{% for s in site.socials %}<a href="{{ s.url }}">{{ s.name }}</a>
{% endfor %}{% if site.guestbook_url != "" %}<a href="{{ site.guestbook_url }}">guestbook</a>{% endif %}
</span>
</div>
