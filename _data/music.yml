# ♫ your tracks ♫
# Newest at the top. Copy one block (from "- title" down) to add a song.
#
#   title:  song name (required)
#   date:   YYYY-MM-DD (required)
#   type:   single / ep / album / demo / cover / remix  (anything you like)
#   blurb:  a short sentence about it
#   cover:  optional image path, e.g. /assets/img/covers/my-song.jpg
#           (put the picture in assets/img/covers/). Leave out for a cute default.
#   links:  any number of name + url pairs (soundcloud, spotify, bandcamp…)
#   embed:  optional player URL shown right on the page. Use the "embed" /
#           "share → embed" src URL from SoundCloud, Bandcamp or YouTube,
#           e.g. https://www.youtube.com/embed/VIDEO_ID
#           or   https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/you/track
#   audio:  optional path to an mp3 you uploaded to assets/audio/
#           (keep files small! GitHub dislikes files over ~25MB)

