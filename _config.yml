# -----------------------------------------------------------------
#  Site settings
#  After editing this file, GitHub Pages rebuilds automatically
#  (give it a minute or two). Locally, restart `jekyll serve`.
# -----------------------------------------------------------------

title: "Vivien"
author: "Vivien"
tagline: "software engineering student"
description: "Personal site and blog of a software engineering student."

# The repository is named "meowzerskittycat.github.io", so GitHub serves
# the site at the root of https://meowzerskittycat.github.io/ and baseurl
# stays empty. If you add a custom domain, put it in url.
url: "https://meowzerskittycat.github.io"
baseurl: ""

# Status page. Change whenever you like.
# You can rename, add or remove lines; the part before the colon is the label.
status:
  mood: "Tired but fine."
  listening_to: "Epitaph (2004)"
  working_on: "A song that might never be finished."
  studying: "C++"

# Links shown on the right of the menu bar. Empty for now.
# Add real links only, like this:
#   socials:
#     - name: "instagram"
#       url: "https://instagram.com/yourname"
socials: []

# Optional: link to a guestbook (e.g. https://atabook.org).
# Leave empty ("") to hide it.
guestbook_url: ""


# Jekyll settings (you normally don't need to touch these)
theme: null           # no GitHub theme; this site has its own stylesheet
markdown: kramdown
kramdown:
  footnote_backlink: "&#8617;&#xFE0E;"   # the return arrow, forced to render as text, not an emoji
permalink: pretty

# Blog posts in _posts/ appear on the Blog page, each at /blog/<name>/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/

# Atom feed of the posts, at /feed.xml (the plugin is built into GitHub Pages)
plugins:
  - jekyll-feed

exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
