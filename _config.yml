# ─────────────────────────────────────────────────────────────
#  ♡ site settings ♡
#  Edit the values below to change your name, bio, mood, links…
#  After editing this file, GitHub Pages rebuilds automatically
#  (give it a minute or two). Locally, restart `jekyll serve`.
# ─────────────────────────────────────────────────────────────

title: "meowzers' little corner"
author: "meowzers"          # your name / nickname, shown in the header
tagline: "music maker ♡ uni student ♡ soft boy"
description: "a tiny cute corner of the internet where i share my music and uni life"

# The repo is called "website", so GitHub serves it at
#   https://meowzerskittycat.github.io/website/
# If you ever rename the repo to "meowzerskittycat.github.io"
# or add a custom domain, change baseurl to "" (empty).
url: "https://meowzerskittycat.github.io"
baseurl: "/website"

# Little status box in the sidebar ─ change whenever you like!
status:
  mood: "sleepy but inspired"
  listening: "lo-fi study beats"
  working_on: "a new track (shh, it's a secret)"
  studying: "for midterms ;_;"

# Your social / music links. Delete any line you don't use,
# or add more. "icon" is just an emoji or short text.
socials:
  - name: "soundcloud"
    url: "https://soundcloud.com/"
    icon: "☁"
  - name: "bandcamp"
    url: "https://bandcamp.com/"
    icon: "♫"
  - name: "youtube"
    url: "https://youtube.com/"
    icon: "▶"
  - name: "instagram"
    url: "https://instagram.com/"
    icon: "✿"

# Optional: link to a free guestbook (e.g. https://www.smartguestbook.com
# or https://atabook.org). Leave empty ("") to hide the button.
guestbook_url: ""

# Scrolling message at the top of every page
marquee: "✿ welcome to my little corner ✿ new music coming soon ✿ thank u for visiting ♡ ✿ stay hydrated & be kind ✿"

# ── Jekyll stuff (you normally don't need to touch this) ──
theme: null           # no GitHub theme ─ this site has its own look
markdown: kramdown
permalink: pretty
exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
