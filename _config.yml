# -----------------------------------------------------------------
#  Site settings
#  After editing this file, GitHub Pages rebuilds automatically
#  (give it a minute or two). Locally, restart `jekyll serve`.
# -----------------------------------------------------------------

title: "Vivien"
author: "Vivien"
tagline: "software engineering student"
description: "Personal site of a software engineering student: project write-ups and notes."

# The site is served from the root of the domain (no sub-folder).
# For that to work on GitHub Pages, the repository has to be named
# "meowzerskittycat.github.io", or a custom domain has to be set up.
# See "Deploying" in AGENTS.md.
url: "https://meowzerskittycat.github.io"
baseurl: ""

# Status page. Change whenever you like.
# You can rename, add or remove lines; the part before the colon is the label.
status:
  mood: "Tired but fine"
  listening: "(an album you like)"
  working_on: "A beat that might never be finished"
  studying: "Calculus"

# Links shown on the right of the menu bar. Empty for now.
# Add real links only, like this:
#   socials:
#     - name: "instagram"
#       url: "https://instagram.com/yourname"
socials: []

# Optional: link to a guestbook (e.g. https://atabook.org).
# Leave empty ("") to hide it.
guestbook_url: ""


# Jekyll settings (you normally don't need to touch these)
theme: null           # no GitHub theme; this site has its own stylesheet
markdown: kramdown
permalink: pretty

# Blog posts in _posts/ appear on the Projects page at /projects/<name>/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /projects/:title/

# Atom feed of the posts, at /feed.xml (the plugin is built into GitHub Pages)
plugins:
  - jekyll-feed

exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
